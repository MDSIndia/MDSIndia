<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="carGlassBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#212b3d"/>
      <stop offset="45%" stop-color="#0b0e15"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="carGlassReflection" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="42%" stop-color="#bcd6ff" stop-opacity="0.32"/>
      <stop offset="56%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Frame/pillar color, the border left showing around the inset glass. -->
  <rect x="0" y="0" width="200" height="100" fill="#12151a"/>
  <!-- Tinted glass panel. -->
  <rect x="7" y="7" width="186" height="86" rx="5" fill="url(#carGlassBase)"/>
  <!-- Diagonal sky/cloud reflection sweep, the same cue used on the -->
  <!-- building window texture so cars and towers read as the same -->
  <!-- material family. -->
  <rect x="7" y="7" width="186" height="86" rx="5" fill="url(#carGlassReflection)"/>
  <rect x="7" y="7" width="186" height="86" rx="5" fill="none" stroke="#262c36" stroke-width="2"/>
</svg>
